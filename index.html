<!DOCTYPE html>  <html lang="en">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>Autoreply Bot | Connect WhatsApp</title>  
  <meta name="description" content="Connect WhatsApp Business to Autoreply Bot using Meta Embedded Signup.">    <style>  
    * { box-sizing: border-box; }  
  
    body {  
      margin: 0;  
      font-family: Arial, sans-serif;  
      color: #1f2937;  
      background: #f3f6f8;  
      line-height: 1.6;  
    }  
  
    header {  
      background: #111827;  
      color: white;  
      padding: 20px 7%;  
    }  
  
    header h1 { margin: 0; }  
  
    main {  
      max-width: 760px;  
      margin: 55px auto;  
      padding: 0 18px;  
    }  
  
    .card {  
      background: white;  
      padding: 30px;  
      border-radius: 14px;  
      box-shadow: 0 5px 25px rgba(0,0,0,.07);  
    }  
  
    h2 { margin-top: 0; }  
  
    button {  
      width: 100%;  
      border: 0;  
      border-radius: 8px;  
      padding: 15px;  
      background: #128c50;  
      color: white;  
      font-size: 16px;  
      font-weight: bold;  
      cursor: pointer;  
      margin-top: 16px;  
    }  
  
    button:disabled {  
      opacity: .6;  
      cursor: wait;  
    }  
  
    #status {  
      margin-top: 18px;  
      overflow-wrap: anywhere;  
      font-size: 14px;  
    }  
  
    footer {  
      text-align: center;  
      padding: 25px;  
      color: #6b7280;  
    }  
  
    a { color: #0878c9; }  
  </style>  </head>  <body>  
  <header>  
    <h1>Autoreply Bot</h1>  
  </header>    <main>  
    <section class="card">  
      <h2>Connect WhatsApp Business</h2>  <p>  
    Connect your WhatsApp Business account using Meta's  
    official Embedded Signup flow.  
  </p>  

  <p>  
    If Meta offers WhatsApp Business App onboarding for your  
    account, follow the prompts shown by Meta.  
  </p>  

  <button id="connectButton" type="button">  
    Connect WhatsApp  
  </button>  

  <p id="status" role="status" aria-live="polite">  
    Ready to connect.  
  </p>  

  <p>  
    <a href="/api/privacy">Privacy Policy</a>  
  </p>  
</section>

  </main>    <footer>© 2026 Autoreply Bot</footer>    <script>  
    "use strict";  
  
    const META_APP_ID = "2919372611766017";  
    const CONFIG_ID = "1612175480652117";  
    const GRAPH_VERSION = "v26.0";  
  
    const button = document.getElementById("connectButton");  
    const status = document.getElementById("status");  
  
    let sdkReady = false;  
    let signupInProgress = false;  
  
    window.fbAsyncInit = function () {  
      FB.init({  
        appId: META_APP_ID,  
        autoLogAppEvents: true,  
        xfbml: false,  
        version: GRAPH_VERSION  
      });  
  
      sdkReady = true;  
    };  
  
    (function (document, tag, id) {  
      if (document.getElementById(id)) return;  
  
      const script = document.createElement(tag);  
      http://script.id = id;  
      script.src = "https://connect.facebook.net/en\_US/sdk.js";  
      script.async = true;  
      script.defer = true;  
  
      script.onerror = function () {  
        status.textContent =  
          "Meta SDK could not load. Check your connection and try again.";  
      };  
  
      document.head.appendChild(script);  
    })(document, "script", "facebook-jssdk");  
  
    function receiveSignupMessage(event) {  
      if (event.origin !== "https://www.facebook.com" &&  
          event.origin !== "https://web.facebook.com") {  
        return;  
      }  
  
      // Session information is useful for completing signup,  
      // but it is not an access token.  
      try {  
        const data = typeof event.data === "string"  
          ? JSON.parse(event.data)  
          : event.data;  
  
        if (data && data.type === "WA_EMBEDDED_SIGNUP") {  
          console.log("WhatsApp signup session event received.");  
        }  
      } catch (_) {  
        // Ignore unrelated Facebook messages.  
      }  
    }  
  
    window.addEventListener("message", receiveSignupMessage);  
  
    button.addEventListener("click", function () {  
      if (!sdkReady) {  
        status.textContent =  
          "Meta SDK is loading. Wait a moment and try again.";  
        return;  
      }  
  
      if (signupInProgress) return;  
  
      signupInProgress = true;  
      button.disabled = true;  
  
      status.textContent =  
        "Opening Meta signup. Follow the official prompts.";  
  
      FB.login(async function (response) {  
        try {  
          const authCode = response?.authResponse?.code;  
  
          if (!authCode) {  
            status.textContent =  
              "Meta did not return an authorization code. Signup may have been cancelled, or the configuration may be incorrect.";  
            return;  
          }  
  
          status.textContent =  
            "Authorization received. Exchanging code securely with the backend...";  
  
          const exchangeResponse = await fetch("/api/exchange-token", {  
            method: "POST",  
            headers: {  
              "Content-Type": "application/json"  
            },  
            body: JSON.stringify({ code: authCode })  
          });  
  
          const result = await exchangeResponse.json();  
  
          if (!exchangeResponse.ok || !result.success) {  
            status.textContent =  
              result.error ||  
              "Backend token exchange failed. Check server configuration.";  
            return;  
          }  
  
          status.textContent =  
            result.message ||  
            "Authorization code exchange completed. WhatsApp account setup still needs verification.";  
        } catch (error) {  
          status.textContent =  
            "Could not contact the backend. Check the Vercel deployment and logs.";  
        } finally {  
          signupInProgress = false;  
          button.disabled = false;  
        }  
      }, {  
        config_id: CONFIG_ID,  
        response_type: "code",  
        override_default_response_type: true,  
        extras: {  
          featureType: "whatsapp_business_app_onboarding",  
          sessionInfoVersion: "3",  
          setup: {}  
        }  
      });  
    });  
  </script>  </body>  
</html>
